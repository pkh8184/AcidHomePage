        // CSV 파싱 함수
        const parseCSV = (csv) => {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());
                
                const obj = {};
                headers.forEach((header, idx) => {
                    obj[header.trim()] = values[idx] || '';
                });
                return obj;
            });
        };

        // \t를 줄바꿈으로 변환
        const parseLineBreaks = (str) => {
            if (!str) return '';
            return str.replace(/\\t/g, '\n');
        };

        const parseFeatures = (str) => {
            if (!str) return [];
            return str.split('|').map(item => {
                const [title, desc] = item.split(':');
                return { title: title?.trim() || '', desc: desc?.trim() || '' };
            });
        };

        // languages 파싱: "ko|en|ja" -> ["ko", "en", "ja"]
        const parseLanguages = (str) => {
            if (!str) return [];
            return str.split('|').map(s => s.trim()).filter(s => s);
        };

                    title: "이용약관",
                    lastUpdated: "2025년 1월 25일",
                    content: '<h2>제1조 (목적)</h2><p>본 약관은 AcidStudio(이하 "판매자")가 Unity Asset Store 또는 기타 플랫폼을 통해 제공하는 디지털 에셋의 이용조건을 규정합니다.</p><h2>제2조 (라이선스)</h2><h3>허용되는 사용</h3><ul><li>구매자 본인의 상업적/비상업적 프로젝트에 에셋 사용</li><li>에셋의 수정 및 커스터마이징</li><li>프로젝트 내에 에셋을 통합하여 배포</li></ul><h3>금지되는 사용</h3><div class="warning-box"><p><strong>⚠️ 다음 행위는 엄격히 금지됩니다:</strong></p></div><ul><li>에셋 자체를 재판매, 재배포, 공유하는 행위</li><li>에셋을 다른 에셋 스토어나 플랫폼에 업로드하는 행위</li><li>제3자에게 라이선스를 양도하거나 서브라이선스하는 행위</li></ul><h2>제3조 (환불 정책)</h2><div class="warning-box"><p><strong>⚠️ 환불 정책 (매우 중요)</strong></p></div><ol><li><strong>디지털 콘텐츠의 특성상, 구매 완료 후에는 원칙적으로 환불이 불가능합니다.</strong></li><li>에셋 설명과 실제 내용이 현저히 다른 경우, 기술적 결함으로 작동하지 않는 경우에 한해 환불을 검토합니다.</li><li>환불 요청은 구매 후 14일 이내에 하여야 합니다.</li><li>단순 변심, 이미 프로젝트에 사용한 경우, 구매자 환경 문제로 인한 호환성 이슈는 환불이 거부됩니다.</li></ol><h2>제4조 (보증의 부인)</h2><p>에셋은 "있는 그대로(AS IS)" 제공되며, 사용으로 인한 모든 결과에 대한 책임은 구매자에게 있습니다.</p><h2>제5조 (책임의 제한)</h2><p>판매자의 총 책임은 구매자가 해당 에셋에 대해 지불한 금액을 초과하지 않습니다.</p><div class="info-box"><p><strong>본 약관은 2025년 1월 25일부터 시행됩니다.</strong></p></div>'
                },
                privacyPolicy: {
                    title: "개인정보 처리방침",
                    lastUpdated: "2025년 1월 25일",
                    content: '<h2>1. 개인정보의 처리 목적</h2><p>AcidStudio는 고객 지원, 거래 기록 관리, 서비스 개선을 위해 최소한의 개인정보를 처리합니다.</p><h2>2. 수집하는 개인정보 항목</h2><p>Unity Asset Store 등 플랫폼을 통해 판매하므로 직접 수집하는 개인정보는 최소화됩니다:</p><ul><li>고객 문의 시: 이메일 주소, 문의 내용</li><li>구매 확인 시: 인보이스 번호, 구매 일자</li></ul><h2>3. 개인정보의 보유 기간</h2><ul><li>고객 문의 기록: 문의 해결 후 1년</li><li>거래 관련 기록: 전자상거래법에 따라 5년</li></ul><h2>4. 정보주체의 권리</h2><p>열람, 정정, 삭제, 처리정지 요구가 가능합니다.</p><h2>5. 개인정보 보호책임자</h2><ul><li>AcidStudio 대표</li><li>문의: 에셋 상세 페이지 내 연락처</li></ul><div class="info-box"><p><strong>본 개인정보 처리방침은 2025년 1월 25일부터 시행됩니다.</strong></p></div>'
                }
            }
        };

        const categories = [
            { id: 'all', name: '전체', icon: '🎯' },
            { id: 'asset', name: '에셋', icon: '📦' },
            { id: 'game', name: '게임', icon: '🎮' },
            { id: 'website', name: '홈페이지', icon: '🌐' },
            { id: 'app', name: '앱', icon: '📱' }
        ];

        const getCategoryTag = (category) => {
            const tags = {
                asset: { class: 'tag-asset', label: 'ASSET' },
                game: { class: 'tag-game', label: 'GAME' },
                website: { class: 'tag-website', label: 'WEBSITE' },
                app: { class: 'tag-app', label: 'APP' }
            };
            return tags[category] || { class: 'tag-asset', label: category?.toUpperCase() || 'OTHER' };
        };

        const getCategoryGradient = (category) => {
            const gradients = {
                asset: 'var(--gradient-acid)',
                game: 'var(--gradient-pink)',
                website: 'var(--gradient-purple)',
                app: 'var(--gradient-orange)'
            };
            return gradients[category] || 'var(--gradient-acid)';
        };

        const navigateTo = (path) => { window.location.hash = path; };
        const getBaseUrl = () => window.location.origin + window.location.pathname;

        const parseRoute = (projects) => {
            const hash = window.location.hash.slice(1);
            if (!hash || hash === '/') return { type: 'home' };
            
            const parts = hash.split('/').filter(p => p);
            if (parts[0] === 'project' && parts[1]) {
                const slug = parts[1].toLowerCase();
                const project = projects.find(p => p.slug === slug);
                if (project) {
                    if (parts[2] === 'terms') return { type: 'legal', projectSlug: slug, legalType: 'termsOfService' };
                    if (parts[2] === 'privacy') return { type: 'legal', projectSlug: slug, legalType: 'privacyPolicy' };
                    return { type: 'project', projectSlug: slug };
                }
            }
            return { type: 'home' };
        };

        // 텍스트를 HTML로 변환 (\t -> <br>)
        const TextWithLineBreaks = ({ text }) => {
            const html = parseLineBreaks(text).replace(/\n/g, '<br/>');
            return <span dangerouslySetInnerHTML={{ __html: html }} />;
        };

        const ProjectCard = ({ project, onClick }) => {
            const tag = getCategoryTag(project.category);
            return (
                <div className="project-card" onClick={onClick}>
                    <div className="project-thumbnail">
                        {project.thumbnail ? (
                            <img src={getImageUrl(project.thumbnail)} alt={project.title} />
                        ) : (
                            <div className="project-thumbnail-placeholder" style={{ background: getCategoryGradient(project.category), color: 'var(--bg-primary)' }}>
                                {project.title?.charAt(0)}
                            </div>
                        )}
                    </div>
                    <div className="project-info">
                        <span className={`project-category-tag ${tag.class}`}>{tag.label}</span>
                        <h3 className="project-title">{project.title}</h3>
                        <p className="project-desc">{project.description}</p>
                    </div>
                </div>
            );
        };

        const ProjectDetail = ({ project, onBack, onLegalClick }) => {
            const tag = getCategoryTag(project.category);
            const baseUrl = getBaseUrl();
            const features = parseFeatures(project.features);
            const languages = parseLanguages(project.languages);
            
            return (
                <div className="project-detail active">
                    <button className="back-btn" onClick={onBack}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        프로젝트 목록으로
                    </button>
                    <div className="detail-header">
                        <div className="detail-thumbnail">
                            {(project.detailImage || project.thumbnail) ? (
                                <img src={getImageUrl(project.detailImage || project.thumbnail)} alt={project.title} />
                            ) : (
                                <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: getCategoryGradient(project.category), fontSize: '72px', fontWeight: '800', color: 'var(--bg-primary)' }}>
                                    {project.title?.charAt(0)}
                                </div>
                            )}
                        </div>
                        <div className="detail-info">
                            <span className={`project-category-tag ${tag.class}`}>{tag.label}</span>
                            <h1 className="detail-title">{project.title}</h1>
                            <p className="detail-desc"><TextWithLineBreaks text={project.fullDescription} /></p>
                            <div className="detail-links">
                                {project.projectUrl && (
                                    <a href={project.projectUrl} className="detail-link" target="_blank" rel="noopener noreferrer">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
                                        바로가기
                                    </a>
                                )}
                            </div>
                        </div>
                    </div>
                    
                    {features.length > 0 && (
                        <div className="content-section" style={{ marginBottom: '24px' }}>
                            <h2>✨ 주요 기능</h2>
                            <div className="feature-grid">
                                {features.map((feature, idx) => (
                                    <div className="feature-item" key={idx}>
                                        <h4>{feature.title}</h4>
                                        <p>{feature.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {languages.length > 0 && (
                        <div className="content-section" style={{ marginBottom: '24px' }}>
                            <h2>🌍 지원 언어 ({languages.length}개국어)</h2>
                            <p style={{ lineHeight: '2' }}>{languages.join(' • ')}</p>
                        </div>
                    )}
                    
                    <div className="legal-section">
                        <h3 className="legal-title">📋 법적 고지</h3>
                        <div className="legal-links">
                            <a className="legal-link" onClick={(e) => { e.preventDefault(); onLegalClick('termsOfService', project.slug); }}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                                이용약관
                            </a>
                            <a className="legal-link" onClick={(e) => { e.preventDefault(); onLegalClick('privacyPolicy', project.slug); }}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                개인정보 처리방침
                            </a>
                        </div>
                        <div className="url-info">
                            <strong>🔗 직접 링크:</strong><br/>
                            프로젝트: {baseUrl}#/project/{project.slug}<br/>
                            이용약관: {baseUrl}#/project/{project.slug}/terms<br/>
                            개인정보처리방침: {baseUrl}#/project/{project.slug}/privacy
                        </div>
                    </div>
                </div>
            );
        };

        const LegalPage = ({ type, project, onBack }) => {
            const legalType = project.legalType || 'asset';
            const content = legalContent[legalType]?.[type] || legalContent.asset[type];
            const baseUrl = getBaseUrl();
            
            return (
                <div className="legal-page">
                    <button className="back-btn" onClick={onBack}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        {project.title}으로 돌아가기
                    </button>
                    <h1>{content.title}</h1>
                    <p className="last-updated">최종 수정일: {content.lastUpdated}</p>
                    <p style={{ color: 'var(--text-muted)', marginBottom: '24px' }}>
                        적용 대상: <strong style={{ color: 'var(--accent-primary)' }}>{project.title}</strong>
                    </p>
                    <div className="url-info" style={{ marginBottom: '24px' }}>
                        <strong>🔗 이 페이지 직접 링크:</strong> {baseUrl}#/project/{project.slug}/{type === 'termsOfService' ? 'terms' : 'privacy'}
                    </div>
                    <div dangerouslySetInnerHTML={{ __html: content.content }} />
                </div>
            );
        };

        const Sidebar = ({ activeCategory, onCategoryChange, projectCounts, onLogoClick }) => (
            <aside className="sidebar">
                <div className="logo-section">
                    <div className="logo" onClick={onLogoClick}><span className="logo-text">A</span></div>
                    <h1 className="studio-name" onClick={onLogoClick}>AcidStudio</h1>
                    <p className="studio-desc">게임 / 에셋 / 웹 / 앱<br/>개발 스튜디오</p>
                </div>
                <div className="social-links">
                    <a href="https://discord.gg/your-discord" className="social-btn" target="_blank" rel="noopener noreferrer">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg>
                        Discord
                    </a>
                </div>
                <nav>
                    <div className="category-section">
                        <div className="category-title">카테고리</div>
                        <ul className="category-list">
                            {categories.map(cat => (
                                <li key={cat.id} className={`category-item ${activeCategory === cat.id ? 'active' : ''}`} onClick={() => onCategoryChange(cat.id)}>
                                    <span>{cat.icon}</span>
                                    <span>{cat.name}</span>
                                    <span className="count">{projectCounts[cat.id] || 0}</span>
                                </li>
                            ))}
                        </ul>
                    </div>
                </nav>
            </aside>
        );

        const App = () => {
            const [projects, setProjects] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeCategory, setActiveCategory] = useState('all');
            const [currentRoute, setCurrentRoute] = useState({ type: 'home' });

            useEffect(() => {
                const loadProjects = async () => {
                    try {
                        const base = window.location.href.split('#')[0].replace(/\/[^\/]*$/, '/');
                        const response = await fetch(base + 'data/projects.csv');
                        const csv = await response.text();
                        const data = parseCSV(csv);
                        setProjects(data);
                        setCurrentRoute(parseRoute(data));
                    } catch (error) {
                        console.error('Failed to load projects:', error);
                    } finally {
                        setLoading(false);
                    }
                };
                loadProjects();
            }, []);

            useEffect(() => {
                const handleHashChange = () => setCurrentRoute(parseRoute(projects));
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [projects]);

            const projectCounts = {
                all: projects.length,
                asset: projects.filter(p => p.category === 'asset').length,
                game: projects.filter(p => p.category === 'game').length,
                website: projects.filter(p => p.category === 'website').length,
                app: projects.filter(p => p.category === 'app').length
            };

            const filteredProjects = activeCategory === 'all' ? projects : projects.filter(p => p.category === activeCategory);

            const renderContent = () => {
                if (loading) return <div className="loading">프로젝트 로딩 중...</div>;

                if (currentRoute.type === 'legal') {
                    const project = projects.find(p => p.slug === currentRoute.projectSlug);
                    if (project) {
                        return <LegalPage type={currentRoute.legalType} project={project} onBack={() => navigateTo(`/project/${currentRoute.projectSlug}`)} />;
                    }
                }

                if (currentRoute.type === 'project') {
                    const project = projects.find(p => p.slug === currentRoute.projectSlug);
                    if (project) {
                        return <ProjectDetail 
                            project={project} 
                            onBack={() => navigateTo('/')} 
                            onLegalClick={(type, slug) => navigateTo(`/project/${slug}/${type === 'termsOfService' ? 'terms' : 'privacy'}`)} 
                        />;
                    }
                }

                return (
                    <>
                        <header className="page-header">
                            <h1 className="page-title">Our Projects</h1>
                            <p className="page-subtitle">{activeCategory === 'all' ? '모든 프로젝트' : categories.find(c => c.id === activeCategory)?.name} 목록입니다</p>
                        </header>
                        <div className="project-grid">
                            {filteredProjects.map((project, idx) => (
                                <ProjectCard key={project.slug || idx} project={project} onClick={() => navigateTo(`/project/${project.slug}`)} />
                            ))}
                        </div>
                    </>
                );
            };

            return (
                <div className="app-container">
                    <Sidebar
                        activeCategory={activeCategory}
                        onCategoryChange={(cat) => { setActiveCategory(cat); navigateTo('/'); }}
                        projectCounts={projectCounts}
                        onLogoClick={() => navigateTo('/')}
                    />
                    <main className="main-content">{renderContent()}</main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
