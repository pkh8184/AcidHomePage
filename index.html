<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcidStudio - Projects</title>
    <meta name="description" content="AcidStudio - 게임, 에셋, 앱 개발 스튜디오. AddTimer, SimpleFx, ScreenEditor 등의 프로젝트를 소개합니다.">
    <meta property="og:title" content="AcidStudio - Projects">
    <meta property="og:description" content="게임, 에셋, 앱 개발 스튜디오">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#09090b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const parseCSV = (csv) => {
            csv = csv.replace(/^\uFEFF/, '');
            const lines = csv.trim().split('\n').filter(line => line.trim());
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
                    else { current += char; }
                }
                values.push(current.trim());
                const obj = {};
                headers.forEach((header, idx) => { obj[header.trim()] = values[idx] || ''; });
                return obj;
            });
        };

        const parseLineBreaks = (str) => str ? str.replace(/\\t/g, '\n') : '';
        const parseFeatures = (str) => !str ? [] : str.split('|').map(item => { const [title, desc] = item.split(':'); return { title: title?.trim() || '', desc: desc?.trim() || '' }; });
        const parseLanguages = (str) => str ? str.split('|').map(s => s.trim()).filter(s => s) : [];
        const getImageUrl = (path) => {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            return window.location.href.split('#')[0].replace(/\/[^\/]*$/, '/') + path;
        };

        const categories = [
            { id: 'all', name: '전체', icon: '🎯' },
            { id: 'asset', name: '에셋', icon: '📦' },
            { id: 'game', name: '게임', icon: '🎮' },
            { id: 'website', name: '홈페이지', icon: '🌐' },
            { id: 'app', name: '앱', icon: '📱' }
        ];

        const getCategoryTag = (cat) => ({ asset: { class: 'tag-asset', label: 'ASSET' }, game: { class: 'tag-game', label: 'GAME' }, website: { class: 'tag-website', label: 'WEBSITE' }, app: { class: 'tag-app', label: 'APP' } }[cat] || { class: 'tag-asset', label: 'OTHER' });
        const getCategoryGradient = (cat) => ({ asset: 'var(--gradient-acid)', game: 'var(--gradient-pink)', website: 'var(--gradient-purple)', app: 'var(--gradient-orange)' }[cat] || 'var(--gradient-acid)');
        const navigateTo = (path) => { window.location.hash = path; };
        const parseRoute = (projects) => {
            const hash = window.location.hash.slice(1);
            if (!hash || hash === '/') return { type: 'home' };
            const parts = hash.split('/').filter(p => p);
            if (parts[0] === 'project' && parts[1]) {
                const slug = parts[1].toLowerCase();
                const project = projects.find(p => p.slug.toLowerCase() === slug);
                if (project) {
                    if (parts[2] === 'terms') return { type: 'legal', projectSlug: slug, legalType: 'termsOfService' };
                    if (parts[2] === 'privacy') return { type: 'legal', projectSlug: slug, legalType: 'privacyPolicy' };
                    return { type: 'project', projectSlug: slug };
                }
            }
            return { type: 'home' };
        };

        const TextWithBreaks = ({ text }) => <span dangerouslySetInnerHTML={{ __html: parseLineBreaks(text).replace(/\n/g, '<br/>') }} />;

        const Navbar = ({ activeCategory, onCategoryChange, onLogoClick }) => {
            const [scrolled, setScrolled] = useState(false);
            const [menuOpen, setMenuOpen] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            const handleCategoryClick = (cat) => {
                onCategoryChange(cat);
                setMenuOpen(false);
            };
            return (
                <React.Fragment>
                    <nav className={"navbar" + (scrolled ? " navbar-scrolled" : "")}>
                        <div className="navbar-inner">
                            <div className="navbar-logo" onClick={onLogoClick}>
                                <div className="logo-mark">A</div>
                                <span className="logo-text">AcidStudio</span>
                            </div>
                            <div className="navbar-links desktop-only">
                                {categories.map(cat => (
                                    <button key={cat.id}
                                        className={"nav-link" + (activeCategory === cat.id ? " active" : "")}
                                        onClick={() => onCategoryChange(cat.id)}>
                                        {cat.name}
                                    </button>
                                ))}
                            </div>
                            <button className="hamburger mobile-only" onClick={() => setMenuOpen(!menuOpen)} aria-label="메뉴">
                                <span className={"hamburger-line" + (menuOpen ? " open" : "")}></span>
                            </button>
                        </div>
                    </nav>
                    {menuOpen && (
                        <div className="mobile-menu" onClick={() => setMenuOpen(false)}>
                            <div className="mobile-menu-inner" onClick={e => e.stopPropagation()}>
                                {categories.map(cat => (
                                    <button key={cat.id}
                                        className={"mobile-menu-item" + (activeCategory === cat.id ? " active" : "")}
                                        onClick={() => handleCategoryClick(cat.id)}>
                                        {cat.name}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        };

        const Hero = () => (
            <section className="hero">
                <div className="hero-badge">Independent Dev Studio</div>
                <h1 className="hero-title">AcidStudio</h1>
                <p className="hero-desc">게임 · 에셋 · 앱 개발 스튜디오</p>
                <a href="#projects" className="hero-cta" onClick={(e) => {
                    e.preventDefault();
                    document.getElementById('projects')?.scrollIntoView({ behavior: 'smooth' });
                }}>
                    프로젝트 보기 <span className="hero-cta-arrow">↓</span>
                </a>
            </section>
        );

        const Footer = () => (
            <footer className="footer">
                <div className="footer-inner">
                    <span className="footer-copy">© 2026 AcidStudio</span>
                    <span className="footer-dot">·</span>
                    <span className="footer-text">All rights reserved</span>
                </div>
            </footer>
        );

        const ProjectCard = ({ project, onClick, featured }) => {
            const tag = getCategoryTag(project.category);
            return (
                <div className={"project-card" + (featured ? " project-card-featured" : "")} onClick={onClick}>
                    <div className="project-thumbnail">
                        {project.thumbnail
                            ? <img src={getImageUrl(project.thumbnail)} alt={project.title} loading="lazy" />
                            : <div className="project-thumbnail-placeholder" style={{ background: getCategoryGradient(project.category) }}>
                                {project.title?.charAt(0)}
                              </div>
                        }
                    </div>
                    <div className="project-info">
                        <div className="project-meta">
                            <span className={"project-dot " + tag.class}></span>
                            <span className="project-category-label">{tag.label}</span>
                        </div>
                        <h3 className="project-title">{project.title}</h3>
                        <p className="project-desc">{project.description}</p>
                        <span className="project-arrow">→</span>
                    </div>
                </div>
            );
        };

        const ProjectDetail = ({ project, onBack, onLegalClick }) => {
            const tag = getCategoryTag(project.category);
            const features = parseFeatures(project.features);
            const languages = parseLanguages(project.languages);
            return (
                <div className="project-detail active">
                    <button className="back-btn" onClick={onBack}>
                        <span className="back-arrow">←</span> 프로젝트 목록
                    </button>
                    <div className="detail-meta">
                        <span className={"project-dot " + tag.class}></span>
                        <span className="detail-category">{tag.label}</span>
                    </div>
                    <h1 className="detail-title">{project.title}</h1>
                    <div className="detail-image">
                        {(project.detailImage || project.thumbnail)
                            ? <img src={getImageUrl(project.detailImage || project.thumbnail)} alt={project.title} loading="lazy" />
                            : <div className="detail-image-placeholder" style={{ background: getCategoryGradient(project.category) }}>{project.title?.charAt(0)}</div>
                        }
                    </div>
                    <div className="detail-body">
                        <p className="detail-desc"><TextWithBreaks text={project.fullDescription} /></p>
                        {project.projectUrl && (
                            <a href={project.projectUrl} className="detail-cta" target="_blank" rel="noopener noreferrer">
                                바로가기 <span>↗</span>
                            </a>
                        )}
                    </div>
                    {features.length > 0 && (
                        <div className="detail-section">
                            <div className="detail-section-header">주요 기능</div>
                            <div className="feature-grid">
                                {features.map((f, i) => (
                                    <div className="feature-item" key={i}>
                                        <h4>{f.title}</h4>
                                        <p>{f.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    {languages.length > 0 && (
                        <div className="detail-section">
                            <div className="detail-section-header">지원 언어 ({languages.length}개국어)</div>
                            <p className="detail-languages">{languages.join(' · ')}</p>
                        </div>
                    )}
                    <div className="detail-section">
                        <div className="detail-section-header">법적 고지</div>
                        <div className="legal-links">
                            <button className="legal-link" onClick={() => onLegalClick('termsOfService', project.slug)}>이용약관</button>
                            <button className="legal-link" onClick={() => onLegalClick('privacyPolicy', project.slug)}>개인정보 처리방침</button>
                        </div>
                    </div>
                </div>
            );
        };

        const LegalPage = ({ type, project, onBack, legalContent }) => {
            if (!legalContent) return <div className="loading">법적 문서 로딩 중...</div>;
            const legalType = project.legalType || 'asset';
            const content = legalContent[legalType]?.[type] || legalContent.asset?.[type];
            if (!content) return <div className="loading">법적 문서를 찾을 수 없습니다.</div>;
            return (
                <div className="legal-page">
                    <button className="back-btn" onClick={onBack}>← {project.title}으로 돌아가기</button>
                    <h1>{content.title}</h1>
                    <p className="last-updated">최종 수정일: {content.lastUpdated}</p>
                    <p style={{ color: 'var(--text-muted)', marginBottom: '24px' }}>적용 대상: <strong style={{ color: 'var(--accent-primary)' }}>{project.title}</strong></p>
                    <div dangerouslySetInnerHTML={{ __html: content.content }} />
                </div>
            );
        };

        const App = () => {
            const [projects, setProjects] = useState([]);
            const [legalContent, setLegalContent] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [activeCategory, setActiveCategory] = useState('all');
            const [currentRoute, setCurrentRoute] = useState({ type: 'home' });

            useEffect(() => {
                const loadProjects = async () => {
                    try {
                        const base = window.location.href.split('#')[0].replace(/\/[^\/]*$/, '/');
                        const csvUrl = base + 'data/projects.csv';
                        const legalUrl = base + 'data/legal.json';
                        const [csvResponse, legalResponse] = await Promise.all([
                            fetch(csvUrl),
                            fetch(legalUrl)
                        ]);
                        if (!csvResponse.ok) {
                            throw new Error('CSV 로드 실패: HTTP ' + csvResponse.status);
                        }
                        const csv = await csvResponse.text();
                        const data = parseCSV(csv);
                        if (data.length === 0) {
                            throw new Error('CSV 파싱 결과가 비어있습니다');
                        }
                        setProjects(data);
                        setCurrentRoute(parseRoute(data));
                        if (legalResponse.ok) {
                            const legalData = await legalResponse.json();
                            setLegalContent(legalData);
                        } else {
                            console.error('[AcidStudio] Legal JSON 로드 실패: HTTP ' + legalResponse.status);
                        }
                    } catch (err) {
                        console.error('[AcidStudio] Error:', err);
                        setError(err.message);
                    } finally {
                        setLoading(false);
                    }
                };
                loadProjects();
            }, []);

            useEffect(() => {
                const handleHashChange = () => setCurrentRoute(parseRoute(projects));
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [projects]);

            const filteredProjects = activeCategory === 'all' ? projects : projects.filter(p => p.category === activeCategory);

            const renderContent = () => {
                if (loading) return <div className="loading">프로젝트 로딩 중...</div>;
                if (error) return <div className="loading" style={{ color: 'var(--accent-secondary)' }}>⚠ 프로젝트를 불러올 수 없습니다: {error}</div>;
                if (currentRoute.type === 'legal') {
                    const project = projects.find(p => p.slug.toLowerCase() === currentRoute.projectSlug);
                    if (project) return <LegalPage type={currentRoute.legalType} project={project} onBack={() => navigateTo('/project/' + currentRoute.projectSlug)} legalContent={legalContent} />;
                }
                if (currentRoute.type === 'project') {
                    const project = projects.find(p => p.slug.toLowerCase() === currentRoute.projectSlug);
                    if (project) return <ProjectDetail project={project} onBack={() => navigateTo('/')} onLegalClick={(type, slug) => navigateTo('/project/' + slug + '/' + (type === 'termsOfService' ? 'terms' : 'privacy'))} />;
                }
                return (
                    <React.Fragment>
                        <Hero />
                        <section id="projects">
                            <div className="section-header">
                                <h2 className="section-title">Our Projects</h2>
                                <span className="section-count">{filteredProjects.length} works</span>
                            </div>
                            <div className="project-grid">
                                {filteredProjects.map((project, idx) => (
                                    <ProjectCard
                                        key={project.slug || idx}
                                        project={project}
                                        featured={idx === filteredProjects.length - 1 && filteredProjects.length > 2}
                                        onClick={() => navigateTo('/project/' + project.slug)}
                                    />
                                ))}
                            </div>
                        </section>
                    </React.Fragment>
                );
            };

            return (
                <div className="app-container">
                    <Navbar activeCategory={activeCategory} onCategoryChange={(cat) => { setActiveCategory(cat); navigateTo('/'); }} onLogoClick={() => navigateTo('/')} />
                    <main className="main-content">{renderContent()}</main>
                    <Footer />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
