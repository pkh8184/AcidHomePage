<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcidStudio - Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-card: #1a1a24; --bg-card-hover: #222230; --accent-primary: #00ff88; --accent-secondary: #ff3366; --accent-tertiary: #6c5ce7; --accent-app: #ff9f43; --text-primary: #ffffff; --text-secondary: #a0a0b0; --text-muted: #606070; --border-color: #2a2a3a; --gradient-acid: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%); --gradient-pink: linear-gradient(135deg, #ff3366 0%, #ff6b9d 100%); --gradient-purple: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); --gradient-orange: linear-gradient(135deg, #ff9f43 0%, #ffbe76 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; }
        .bg-glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; filter: blur(150px); opacity: 0.15; pointer-events: none; z-index: 0; }
        .bg-glow-1 { top: -200px; right: -200px; background: var(--accent-primary); }
        .bg-glow-2 { bottom: -200px; left: -200px; background: var(--accent-tertiary); }
        .app-container { display: flex; min-height: 100vh; position: relative; z-index: 1; }
        .sidebar { width: 280px; min-height: 100vh; padding: 40px 24px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); position: fixed; left: 0; top: 0; overflow-y: auto; }
        .logo-section { margin-bottom: 40px; }
        .logo { width: 80px; height: 80px; background: var(--gradient-acid); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 255, 136, 0.3); position: relative; overflow: hidden; cursor: pointer; }
        .logo::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent); transform: rotate(45deg); animation: shimmer 3s infinite; }
        @keyframes shimmer { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
        .logo-text { font-size: 28px; font-weight: 800; color: var(--bg-primary); z-index: 1; }
        .studio-name { font-size: 22px; font-weight: 700; margin-bottom: 8px; background: var(--gradient-acid); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; cursor: pointer; }
        .studio-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        .social-links { display: flex; gap: 12px; margin-top: 20px; margin-bottom: 40px; }
        .social-btn { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.3s ease; }
        .social-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--accent-primary); transform: translateY(-2px); }
        .social-btn svg { width: 18px; height: 18px; }
        .category-section { margin-bottom: 24px; }
        .category-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; padding: 8px 12px; background: var(--bg-card); border-radius: 6px; margin-bottom: 12px; border-left: 3px solid var(--accent-primary); }
        .category-list { list-style: none; }
        .category-item { padding: 10px 12px; color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; display: flex; align-items: center; gap: 10px; }
        .category-item:hover { background: var(--bg-card); color: var(--text-primary); }
        .category-item.active { background: rgba(0, 255, 136, 0.1); color: var(--accent-primary); }
        .category-item .count { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); background: var(--bg-card); padding: 2px 8px; border-radius: 10px; }
        .main-content { flex: 1; margin-left: 280px; padding: 40px; }
        .page-header { margin-bottom: 40px; }
        .page-title { font-size: 42px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
        .page-subtitle { font-size: 16px; color: var(--text-secondary); }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .project-card { background: var(--bg-card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.3s ease; animation: fadeInUp 0.5s ease forwards; opacity: 0; }
        .project-card:hover { transform: translateY(-8px); border-color: var(--accent-primary); box-shadow: 0 20px 60px rgba(0, 255, 136, 0.15); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .project-card:nth-child(1) { animation-delay: 0.1s; } .project-card:nth-child(2) { animation-delay: 0.15s; } .project-card:nth-child(3) { animation-delay: 0.2s; } .project-card:nth-child(4) { animation-delay: 0.25s; }
        .project-thumbnail { width: 100%; height: 200px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .project-thumbnail img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .project-card:hover .project-thumbnail img { transform: scale(1.1); }
        .project-thumbnail-placeholder { width: 80px; height: 80px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; }
        .project-info { padding: 20px; }
        .project-category-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
        .tag-asset { background: rgba(0, 255, 136, 0.15); color: var(--accent-primary); }
        .tag-game { background: rgba(255, 51, 102, 0.15); color: var(--accent-secondary); }
        .tag-website { background: rgba(108, 92, 231, 0.15); color: var(--accent-tertiary); }
        .tag-app { background: rgba(255, 159, 67, 0.15); color: var(--accent-app); }
        .project-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
        .project-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        .project-detail { display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .project-detail.active { display: block; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; margin-bottom: 30px; }
        .back-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--accent-primary); }
        .detail-header { display: flex; gap: 40px; margin-bottom: 40px; }
        .detail-thumbnail { width: 400px; height: 300px; background: var(--bg-card); border-radius: 16px; overflow: hidden; flex-shrink: 0; }
        .detail-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .detail-info { flex: 1; }
        .detail-title { font-size: 36px; font-weight: 800; margin-bottom: 16px; }
        .detail-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 24px; }
        .detail-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .detail-link { display: inline-flex; align-items: center; gap: 8px; padding: 14px 24px; background: var(--gradient-acid); border-radius: 10px; color: var(--bg-primary); text-decoration: none; font-size: 14px; font-weight: 600; transition: all 0.3s ease; }
        .detail-link:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 255, 136, 0.4); }
        .legal-section { margin-top: 40px; padding: 24px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); }
        .legal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text-primary); }
        .legal-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .legal-link { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.3s ease; cursor: pointer; }
        .legal-link:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--accent-tertiary); }
        .content-section { background: var(--bg-card); border-radius: 16px; padding: 32px; border: 1px solid var(--border-color); }
        .content-section h2 { font-size: 24px; font-weight: 700; margin-bottom: 20px; }
        .content-section p { font-size: 15px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 16px; }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin: 24px 0; }
        .feature-item { background: var(--bg-secondary); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); }
        .feature-item h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--accent-primary); }
        .feature-item p { font-size: 13px; color: var(--text-secondary); margin: 0; }
        .legal-page { max-width: 900px; }
        .legal-page h1 { font-size: 36px; margin-bottom: 8px; }
        .legal-page .last-updated { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }
        .legal-page h2 { font-size: 20px; font-weight: 700; margin-top: 32px; margin-bottom: 16px; color: var(--accent-primary); }
        .legal-page h3 { font-size: 16px; font-weight: 600; margin-top: 24px; margin-bottom: 12px; color: var(--text-primary); }
        .legal-page p, .legal-page li { font-size: 15px; color: var(--text-secondary); line-height: 1.8; }
        .legal-page ul, .legal-page ol { margin-left: 24px; margin-bottom: 16px; }
        .legal-page li { margin-bottom: 8px; }
        .legal-page .warning-box { background: rgba(255, 51, 102, 0.1); border: 1px solid rgba(255, 51, 102, 0.3); border-radius: 8px; padding: 16px; margin: 16px 0; }
        .legal-page .warning-box p { color: var(--accent-secondary); margin: 0; }
        .legal-page .info-box { background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 8px; padding: 16px; margin: 16px 0; }
        .legal-page .info-box p { color: var(--accent-primary); margin: 0; }
        .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); }
        @media (max-width: 1024px) { .sidebar { width: 240px; } .main-content { margin-left: 240px; } .detail-header { flex-direction: column; } .detail-thumbnail { width: 100%; } }
        @media (max-width: 768px) { .sidebar { position: relative; width: 100%; min-height: auto; border-right: none; border-bottom: 1px solid var(--border-color); } .main-content { margin-left: 0; } .app-container { flex-direction: column; } .project-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const parseCSV = (csv) => {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
                    else { current += char; }
                }
                values.push(current.trim());
                const obj = {};
                headers.forEach((header, idx) => { obj[header.trim()] = values[idx] || ''; });
                return obj;
            });
        };

        const parseLineBreaks = (str) => str ? str.replace(/\\t/g, '\n') : '';
        const parseFeatures = (str) => !str ? [] : str.split('|').map(item => { const [title, desc] = item.split(':'); return { title: title?.trim() || '', desc: desc?.trim() || '' }; });
        const parseLanguages = (str) => str ? str.split('|').map(s => s.trim()).filter(s => s) : [];
        const getImageUrl = (path) => {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            return window.location.href.split('#')[0].replace(/\/[^\/]*$/, '/') + path;
        };

        const legalContent = {
            app: {
                termsOfService: { title: "이용약관", lastUpdated: "2025년 1월 25일", content: '<h2>제1조 (목적)</h2><p>본 약관은 AcidStudio가 제공하는 모바일 애플리케이션 서비스의 이용조건을 규정합니다.</p><h2>제2조 (유료 서비스 및 결제)</h2><div class="warning-box"><p><strong>⚠️ 환불 정책 (중요)</strong></p></div><ol><li><strong>디지털 콘텐츠의 특성상, 구매 완료 후에는 원칙적으로 환불이 불가능합니다.</strong></li><li>결제 후 서비스가 즉시 제공되므로, 단순 변심에 의한 환불은 불가합니다.</li></ol><h2>제3조 (미성년자 이용)</h2><div class="warning-box"><p><strong>⚠️ 미성년자 결제 관련 중요 안내</strong></p></div><ol><li>만 14세 미만 아동의 유료 결제는 법정대리인 동의가 필요합니다.</li><li>미성년자가 동의가 있는 것처럼 속인 경우 환불이 제한됩니다.</li></ol><div class="info-box"><p><strong>본 약관은 2025년 1월 25일부터 시행됩니다.</strong></p></div>' },
                privacyPolicy: { title: "개인정보 처리방침", lastUpdated: "2025년 1월 25일", content: '<h2>1. 개인정보의 처리 목적</h2><p>AcidStudio는 서비스 제공, 개선, 광고, 결제 처리를 위해 개인정보를 처리합니다.</p><h2>2. 수집 항목</h2><ul><li><strong>필수:</strong> 기기 정보, 이용 기록, 광고 식별자</li><li><strong>선택:</strong> 결제 정보, 푸시 토큰</li></ul><div class="info-box"><p><strong>본 방침은 2025년 1월 25일부터 시행됩니다.</strong></p></div>' }
            },
            asset: {
                termsOfService: { title: "이용약관", lastUpdated: "2025년 1월 25일", content: '<h2>제1조 (라이선스)</h2><h3>허용</h3><ul><li>상업적/비상업적 프로젝트에 사용</li><li>수정 및 커스터마이징</li></ul><h3>금지</h3><div class="warning-box"><p><strong>⚠️ 엄격히 금지:</strong></p></div><ul><li>에셋 재판매, 재배포, 공유</li><li>다른 스토어에 업로드</li></ul><h2>제2조 (환불)</h2><div class="warning-box"><p><strong>⚠️ 환불 정책</strong></p></div><ol><li><strong>구매 완료 후 원칙적으로 환불 불가</strong></li><li>단순 변심, 이미 사용한 경우 환불 거부</li></ol><div class="info-box"><p><strong>본 약관은 2025년 1월 25일부터 시행됩니다.</strong></p></div>' },
                privacyPolicy: { title: "개인정보 처리방침", lastUpdated: "2025년 1월 25일", content: '<h2>1. 처리 목적</h2><p>고객 지원, 거래 기록 관리를 위해 최소한의 개인정보를 처리합니다.</p><h2>2. 수집 항목</h2><ul><li>문의 시: 이메일, 문의 내용</li><li>구매 확인 시: 인보이스 번호, 구매 일자</li></ul><div class="info-box"><p><strong>본 방침은 2025년 1월 25일부터 시행됩니다.</strong></p></div>' }
            }
        };

        const categories = [
            { id: 'all', name: '전체', icon: '🎯' },
            { id: 'asset', name: '에셋', icon: '📦' },
            { id: 'game', name: '게임', icon: '🎮' },
            { id: 'website', name: '홈페이지', icon: '🌐' },
            { id: 'app', name: '앱', icon: '📱' }
        ];

        const getCategoryTag = (cat) => ({ asset: { class: 'tag-asset', label: 'ASSET' }, game: { class: 'tag-game', label: 'GAME' }, website: { class: 'tag-website', label: 'WEBSITE' }, app: { class: 'tag-app', label: 'APP' } }[cat] || { class: 'tag-asset', label: 'OTHER' });
        const getCategoryGradient = (cat) => ({ asset: 'var(--gradient-acid)', game: 'var(--gradient-pink)', website: 'var(--gradient-purple)', app: 'var(--gradient-orange)' }[cat] || 'var(--gradient-acid)');
        const navigateTo = (path) => { window.location.hash = path; };
        const parseRoute = (projects) => {
            const hash = window.location.hash.slice(1);
            if (!hash || hash === '/') return { type: 'home' };
            const parts = hash.split('/').filter(p => p);
            if (parts[0] === 'project' && parts[1]) {
                const slug = parts[1].toLowerCase();
                const project = projects.find(p => p.slug === slug);
                if (project) {
                    if (parts[2] === 'terms') return { type: 'legal', projectSlug: slug, legalType: 'termsOfService' };
                    if (parts[2] === 'privacy') return { type: 'legal', projectSlug: slug, legalType: 'privacyPolicy' };
                    return { type: 'project', projectSlug: slug };
                }
            }
            return { type: 'home' };
        };

        const TextWithBreaks = ({ text }) => <span dangerouslySetInnerHTML={{ __html: parseLineBreaks(text).replace(/\n/g, '<br/>') }} />;

        const ProjectCard = ({ project, onClick }) => {
            const tag = getCategoryTag(project.category);
            return (
                <div className="project-card" onClick={onClick}>
                    <div className="project-thumbnail">
                        {project.thumbnail ? <img src={getImageUrl(project.thumbnail)} alt={project.title} /> : <div className="project-thumbnail-placeholder" style={{ background: getCategoryGradient(project.category), color: 'var(--bg-primary)' }}>{project.title?.charAt(0)}</div>}
                    </div>
                    <div className="project-info">
                        <span className={"project-category-tag " + tag.class}>{tag.label}</span>
                        <h3 className="project-title">{project.title}</h3>
                        <p className="project-desc">{project.description}</p>
                    </div>
                </div>
            );
        };

        const ProjectDetail = ({ project, onBack, onLegalClick }) => {
            const tag = getCategoryTag(project.category);
            const features = parseFeatures(project.features);
            const languages = parseLanguages(project.languages);
            return (
                <div className="project-detail active">
                    <button className="back-btn" onClick={onBack}>← 프로젝트 목록으로</button>
                    <div className="detail-header">
                        <div className="detail-thumbnail">
                            {(project.detailImage || project.thumbnail) ? <img src={getImageUrl(project.detailImage || project.thumbnail)} alt={project.title} /> : <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: getCategoryGradient(project.category), fontSize: '72px', fontWeight: '800', color: 'var(--bg-primary)' }}>{project.title?.charAt(0)}</div>}
                        </div>
                        <div className="detail-info">
                            <span className={"project-category-tag " + tag.class}>{tag.label}</span>
                            <h1 className="detail-title">{project.title}</h1>
                            <p className="detail-desc"><TextWithBreaks text={project.fullDescription} /></p>
                            <div className="detail-links">
                                {project.projectUrl && <a href={project.projectUrl} className="detail-link" target="_blank" rel="noopener noreferrer">🔗 바로가기</a>}
                            </div>
                        </div>
                    </div>
                    {features.length > 0 && (
                        <div className="content-section" style={{ marginBottom: '24px' }}>
                            <h2>✨ 주요 기능</h2>
                            <div className="feature-grid">
                                {features.map((f, i) => <div className="feature-item" key={i}><h4>{f.title}</h4><p>{f.desc}</p></div>)}
                            </div>
                        </div>
                    )}
                    {languages.length > 0 && (
                        <div className="content-section" style={{ marginBottom: '24px' }}>
                            <h2>🌍 지원 언어 ({languages.length}개국어)</h2>
                            <p style={{ lineHeight: '2' }}>{languages.join(' • ')}</p>
                        </div>
                    )}
                    <div className="legal-section">
                        <h3 className="legal-title">📋 법적 고지</h3>
                        <div className="legal-links">
                            <a className="legal-link" onClick={() => onLegalClick('termsOfService', project.slug)}>📄 이용약관</a>
                            <a className="legal-link" onClick={() => onLegalClick('privacyPolicy', project.slug)}>🔒 개인정보 처리방침</a>
                        </div>
                    </div>
                </div>
            );
        };

        const LegalPage = ({ type, project, onBack }) => {
            const legalType = project.legalType || 'asset';
            const content = legalContent[legalType]?.[type] || legalContent.asset[type];
            return (
                <div className="legal-page">
                    <button className="back-btn" onClick={onBack}>← {project.title}으로 돌아가기</button>
                    <h1>{content.title}</h1>
                    <p className="last-updated">최종 수정일: {content.lastUpdated}</p>
                    <p style={{ color: 'var(--text-muted)', marginBottom: '24px' }}>적용 대상: <strong style={{ color: 'var(--accent-primary)' }}>{project.title}</strong></p>
                    <div dangerouslySetInnerHTML={{ __html: content.content }} />
                </div>
            );
        };

        const Sidebar = ({ activeCategory, onCategoryChange, projectCounts, onLogoClick }) => (
            <aside className="sidebar">
                <div className="logo-section">
                    <div className="logo" onClick={onLogoClick}><span className="logo-text">A</span></div>
                    <h1 className="studio-name" onClick={onLogoClick}>AcidStudio</h1>
                    <p className="studio-desc">게임 / 에셋 / 웹 / 앱<br/>개발 스튜디오</p>
                </div>
                <div className="social-links">
                    <a href="https://discord.gg/your-discord" className="social-btn" target="_blank" rel="noopener noreferrer">💬 Discord</a>
                </div>
                <nav>
                    <div className="category-section">
                        <div className="category-title">카테고리</div>
                        <ul className="category-list">
                            {categories.map(cat => (
                                <li key={cat.id} className={"category-item " + (activeCategory === cat.id ? 'active' : '')} onClick={() => onCategoryChange(cat.id)}>
                                    <span>{cat.icon}</span><span>{cat.name}</span><span className="count">{projectCounts[cat.id] || 0}</span>
                                </li>
                            ))}
                        </ul>
                    </div>
                </nav>
            </aside>
        );

        const App = () => {
            const [projects, setProjects] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeCategory, setActiveCategory] = useState('all');
            const [currentRoute, setCurrentRoute] = useState({ type: 'home' });

            useEffect(() => {
                const loadProjects = async () => {
                    try {
                        const base = window.location.href.split('#')[0].replace(/\/[^\/]*$/, '/');
                        const response = await fetch(base + 'data/projects.csv');
                        const csv = await response.text();
                        const data = parseCSV(csv);
                        setProjects(data);
                        setCurrentRoute(parseRoute(data));
                    } catch (error) {
                        console.error('Failed to load projects:', error);
                    } finally {
                        setLoading(false);
                    }
                };
                loadProjects();
            }, []);

            useEffect(() => {
                const handleHashChange = () => setCurrentRoute(parseRoute(projects));
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [projects]);

            const projectCounts = {
                all: projects.length,
                asset: projects.filter(p => p.category === 'asset').length,
                game: projects.filter(p => p.category === 'game').length,
                website: projects.filter(p => p.category === 'website').length,
                app: projects.filter(p => p.category === 'app').length
            };

            const filteredProjects = activeCategory === 'all' ? projects : projects.filter(p => p.category === activeCategory);

            const renderContent = () => {
                if (loading) return <div className="loading">프로젝트 로딩 중...</div>;
                if (currentRoute.type === 'legal') {
                    const project = projects.find(p => p.slug === currentRoute.projectSlug);
                    if (project) return <LegalPage type={currentRoute.legalType} project={project} onBack={() => navigateTo('/project/' + currentRoute.projectSlug)} />;
                }
                if (currentRoute.type === 'project') {
                    const project = projects.find(p => p.slug === currentRoute.projectSlug);
                    if (project) return <ProjectDetail project={project} onBack={() => navigateTo('/')} onLegalClick={(type, slug) => navigateTo('/project/' + slug + '/' + (type === 'termsOfService' ? 'terms' : 'privacy'))} />;
                }
                return (
                    <React.Fragment>
                        <header className="page-header">
                            <h1 className="page-title">Our Projects</h1>
                            <p className="page-subtitle">{activeCategory === 'all' ? '모든 프로젝트' : categories.find(c => c.id === activeCategory)?.name} 목록입니다</p>
                        </header>
                        <div className="project-grid">
                            {filteredProjects.map((project, idx) => <ProjectCard key={project.slug || idx} project={project} onClick={() => navigateTo('/project/' + project.slug)} />)}
                        </div>
                    </React.Fragment>
                );
            };

            return (
                <div className="app-container">
                    <Sidebar activeCategory={activeCategory} onCategoryChange={(cat) => { setActiveCategory(cat); navigateTo('/'); }} projectCounts={projectCounts} onLogoClick={() => navigateTo('/')} />
                    <main className="main-content">{renderContent()}</main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
